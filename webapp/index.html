<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- resizes-content: the page shrinks when the keyboard opens instead of sliding sideways -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <title>Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="back" hidden aria-label="Back">←</button>
    <b>Reports</b>
    <span id="who" class="muted"></span>
  </header>
  <main id="view"><div class="empty">Loading…</div></main>
  <div id="viewer" hidden><img id="viewer-img" alt=""></div>
  <div id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
